<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flappy Bar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  /* Layout: a pixel-art arcade cabinet screen at the centre, controls and leaderboard stacked below.
     Single night-at-the-bar look, palette taken from the Baratie: slatted wood ceiling, red trim, warm lamps. */
  :root {
    --night: #1a110c;
    --night-2: #2a1a12;
    --wood: #8a5a32;
    --wood-light: #c98b4f;
    --wood-dark: #4a2d18;
    --trim: #8c2a2a;
    --lamp: #ffcf7a;
    --paper: #fff3dc;
    --muted: #c9b08f;
    --font-pixel: "Press Start 2P", "Courier New", monospace;
    --font-body: "VT323", "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { min-height: 100%; -webkit-tap-highlight-color: transparent; }
  button, canvas, input { -webkit-tap-highlight-color: transparent; }
  body {
    background:
      repeating-linear-gradient(0deg, transparent 0 6px, rgba(0, 0, 0, 0.18) 6px 8px),
      linear-gradient(var(--night-2), var(--night));
    color: var(--paper);
    font-family: var(--font-body);
    font-size: 1.25rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding-block: 18px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  body > * { flex-shrink: 0; }
  h1 {
    font-family: var(--font-pixel);
    font-weight: 400;
    font-size: clamp(1.4rem, 6vw, 2rem);
    margin: 0;
    color: var(--lamp);
    text-shadow: 3px 3px 0 var(--trim), 6px 6px 0 var(--wood-dark);
    letter-spacing: 2px;
  }
  .screen {
    position: relative;
    width: min(calc(100% - 16px), 432px);
    border: 6px solid var(--wood-dark);
    box-shadow: 0 0 0 4px var(--wood), 0 0 0 8px var(--wood-dark);
    line-height: 0;
    background: var(--night);
    overflow: hidden;   /* keeps Matteo inside the screen while he slides in and out */
  }
  #game {
    width: 100%;
    max-width: 100%;
    aspect-ratio: 9 / 16;
    display: block;
    image-rendering: pixelated;
    touch-action: manipulation;
    cursor: pointer;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #game:focus-visible { outline: 4px solid var(--lamp); outline-offset: -4px; }

  /* Start screen, drawn over the game */
  .start {
    position: absolute;
    inset: 0;
    line-height: 1.2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    padding: 16px;
    background: rgba(26, 17, 12, 0.86);
  }
  .start[hidden] { display: none; }
  .start h2 {
    font-family: var(--font-pixel);
    font-weight: 400;
    font-size: 1rem;
    line-height: 1.5;
    margin: 0 0 4px;
    text-align: center;
    color: var(--lamp);
    text-shadow: 2px 2px 0 var(--trim);
    text-wrap: balance;
  }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 6px 3px 8px;
    min-width: 0;
    border: 4px solid var(--wood-dark);
    background: var(--wood);
    box-shadow: inset 0 -4px 0 var(--wood-dark);
    color: var(--paper);
    cursor: pointer;
  }
  .card canvas { width: 72%; aspect-ratio: 1; image-rendering: pixelated; }
  .card[aria-checked="true"] { border-color: var(--lamp); background: var(--wood-light); color: var(--night); }
  .card:focus-visible { outline: 4px solid var(--paper); outline-offset: 2px; }
  .card-name { font-family: var(--font-pixel); font-size: 0.5rem; }
  .card-best { font-family: var(--font-body); font-size: 1.05rem; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
  .card[aria-disabled="true"] { background: var(--night-2); border-color: var(--wood-dark); color: var(--muted); box-shadow: none; cursor: not-allowed; }
  .card[aria-disabled="true"] .card-best { color: var(--lamp); }
  .start label { font-family: var(--font-pixel); font-size: 0.6rem; margin-top: 6px; color: var(--muted); }
  .start input {
    font: 1.5rem var(--font-body);
    padding: 6px 10px;
    border: 4px solid var(--wood-dark);
    background: var(--paper);
    color: var(--night);
    border-radius: 0;
    min-width: 0;
  }
  .start input:focus-visible { outline: 4px solid var(--lamp); outline-offset: 0; }
  .start input[aria-invalid="true"] { border-color: var(--trim); }
  .start-hint { margin: 0; font-size: 1.1rem; color: var(--muted); }
  .start-hint.error { color: var(--lamp); }
  .go {
    font: 0.8rem var(--font-pixel);
    padding: 14px 10px;
    margin-top: 6px;
    border: 4px solid var(--night);
    background: var(--trim);
    color: var(--paper);
    box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.35), 0 4px 0 var(--night);
    cursor: pointer;
  }
  .go:active { transform: translateY(3px); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.35), 0 1px 0 var(--night); }
  .go:focus-visible { outline: 4px solid var(--lamp); outline-offset: 2px; }

  /* The boss turning up at the end of a run: a giant Matteo rising from behind the counter */
  .boss {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 4px;
    padding: 0 12px;
    line-height: 1.1;
    overflow: hidden;
    pointer-events: none;
    background: radial-gradient(circle at 50% 78%, rgba(255, 207, 122, 0.35), rgba(26, 17, 12, 0.55) 60%);
    animation: boss-in 0.35s steps(5) both;
  }
  .boss[hidden] { display: none; }
  .boss.leaving { animation: boss-out 0.3s steps(4) both; }
  .boss canvas { width: 88%; aspect-ratio: 24 / 22; image-rendering: pixelated; margin-bottom: -2%; }
  .boss-line {
    position: relative;
    margin: 0 0 10px;
    padding: 8px 12px 10px;
    max-width: 100%;
    box-sizing: border-box;
    background: var(--paper);
    color: var(--night);
    border: 4px solid var(--night);
    box-shadow: 4px 4px 0 var(--night);
    font: 1.7rem var(--font-body);
    text-align: center;
  }
  .boss-line::after {                        /* speech-bubble tail pointing down at Matteo */
    content: "";
    position: absolute;
    left: 50%;
    bottom: -16px;
    margin-left: -8px;
    border: 8px solid transparent;
    border-top-color: var(--night);
  }
  .boss-line strong { display: block; font: 0.6rem var(--font-pixel); color: var(--trim); margin-bottom: 6px; }
  .boss[data-mood="angry"] canvas { animation: boss-fume 0.12s steps(2) infinite; }
  @keyframes boss-fume { 50% { transform: translateX(2%); } }
  @keyframes boss-in { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes boss-out { from { transform: none; } to { transform: translateY(100%); } }
  @media (prefers-reduced-motion: reduce) { .boss, .boss.leaving, .boss[data-mood="angry"] canvas { animation: none; } }

  /* Controls under the screen */
  .bar {
    width: min(100%, 432px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .player { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; font-size: 1.4rem; }
  .pix-btn {
    font: 0.55rem var(--font-pixel);
    padding: 8px 10px;
    border: 3px solid var(--wood-dark);
    background: var(--wood);
    color: var(--paper);
    box-shadow: inset 0 -3px 0 var(--wood-dark);
    cursor: pointer;
  }
  .pix-btn:disabled { opacity: 0.45; cursor: default; }
  .home-btn { position: absolute; top: 8px; left: 8px; line-height: 1; box-shadow: inset 0 -3px 0 var(--wood-dark), 2px 2px 0 var(--night); }
  .home-btn[hidden] { display: none; }
  .pix-btn:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
  .note { margin: 0; color: var(--muted); text-align: center; }
  .noscript {
    max-width: 432px;
    margin: 0;
    padding: 14px;
    border: 4px solid var(--trim);
    background: var(--night-2);
    color: var(--paper);
    font-size: 1.4rem;
    line-height: 1.2;
  }

  /* Leaderboard */
  .board {
    width: min(calc(100% - 8px), 432px);
    border: 4px solid var(--wood-dark);
    background: var(--night-2);
    box-shadow: 0 0 0 4px var(--wood);
    padding: 14px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .board h2 {
    font-family: var(--font-pixel);
    font-weight: 400;
    font-size: 0.8rem;
    line-height: 1.5;
    margin: 0;
    color: var(--lamp);
  }
  .board-status { margin: 0; color: var(--muted); }
  .board-status:empty { display: none; }
  #board-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; counter-reset: pos; }
  #board-list li {
    display: grid;
    grid-template-columns: 2.2rem 1fr auto auto;
    align-items: baseline;
    gap: 8px;
    padding: 4px 6px;
    font-size: 1.4rem;
    font-variant-numeric: tabular-nums;
    counter-increment: pos;
  }
  #board-list li:nth-child(odd) { background: rgba(255, 243, 220, 0.04); }
  #board-list li::before { content: counter(pos); font-family: var(--font-pixel); font-size: 0.6rem; color: var(--muted); }
  #board-list li:nth-child(1)::before { color: var(--lamp); }
  #board-list li.me { background: rgba(255, 207, 122, 0.16); }
  #board-list .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board-list .as { font-size: 1.05rem; color: var(--muted); }
  #board-list .pts { font-family: var(--font-pixel); font-size: 0.75rem; color: var(--lamp); }
  kbd { font-family: var(--font-pixel); font-size: 0.6rem; background: var(--paper); color: var(--night); padding: 2px 5px; }
  @media (prefers-reduced-motion: reduce) { .go:active { transform: none; } }
</style>
</head>
<body>

<h1>FLAPPY BAR</h1>
<noscript>
  <p class="noscript">Questa anteprima non fa partire il gioco, perché non esegue JavaScript (succede per esempio aprendo il file dall'app File di iPhone). Apri Flappy Bar dal suo link in Safari, Chrome o nell'app Claude.</p>
  <style>.screen, .bar, .note, .board { display: none; }</style>
</noscript>
<div class="screen">
  <canvas id="game" width="144" height="256" tabindex="0" aria-label="Gioco: tocca o premi spazio per volare tra le colonne del bar"></canvas>
  <form class="start" id="start" novalidate>
    <h2>Chi prende il turno?</h2>
    <div class="cards" role="radiogroup" aria-label="Personaggio" id="cards"></div>
    <label for="nick">IL TUO NICKNAME</label>
    <input id="nick" maxlength="16" autocomplete="nickname" placeholder="es. Re dello spritz" enterkeyhint="go">
    <p class="start-hint" id="start-hint">Con questo nome entri in classifica.</p>
    <button type="submit" class="go" id="go">INIZIA IL TURNO</button>
  </form>
  <div class="boss" id="boss" hidden aria-live="polite">
    <p class="boss-line"><strong>MATTEO</strong><span id="boss-text"></span></p>
    <canvas width="24" height="22" aria-hidden="true"></canvas>
  </div>
  <button type="button" class="pix-btn home-btn" id="home-btn" hidden>HOME</button>
</div>
<div class="bar">
  <span class="player" id="player"></span>
  <button type="button" class="pix-btn" id="music-btn" aria-pressed="true">MUSICA SÌ</button>
  <button type="button" class="pix-btn" id="sfx-btn" aria-pressed="true">EFFETTI SÌ</button>
</div>
<p class="note">Tocca, clicca o premi <kbd>SPAZIO</kbd> per volare.</p>
<section class="board" aria-labelledby="board-title">
  <h2 id="board-title">CLASSIFICA DEL BARATIE</h2>
  <p class="board-status" id="board-status">Collegamento alla classifica…</p>
  <ol id="board-list"></ol>
</section>

<script>

const BOSS_CHANCE = 1;   // he turns up after every run
function bossLine(n) {
  if (n < 50) return "Dopo questo turno puoi anche rimanere a casa.";
  if (n < 150) return "Portami una Spaceman prima che mi arrabbio.";
  if (n < 350) return "Insomma, potevi anche fare di più.";
  if (n < 400) return "Io avrei saputo farlo meglio, vedi tu!";
  return "Sei quasi bravo quanto me.";
}
const BOSS_STAY_MS = 3400;
let bossTimer = null, bossLeaveTimer = null;

function drawBoss(mood) {
  const bc = document.querySelector("#boss canvas");
  const gameCtx = ctx;
  ctx = bc.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, bc.width, bc.height);
  drawPlayer("matteo", 9, 12, 0, true, mood);   // tray raised, like he's making a point
  if (mood === "angry") {                         // steam puffing out on both sides of his head
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    for (const [x, y] of [[0, 5], [1, 4], [1, 6], [0, 2], [16, 4], [17, 5], [17, 3], [18, 2]]) ctx.fillRect(x, y, 1, 1);
  }
  ctx = gameCtx;
  document.getElementById("boss").dataset.mood = mood;
}
function hideBoss(animated) {
  const el = document.getElementById("boss");
  clearTimeout(bossTimer); clearTimeout(bossLeaveTimer);
  if (el.hidden) return;
  if (!animated || reduceMotion) { el.hidden = true; el.classList.remove("leaving"); return; }
  el.classList.add("leaving");
  bossLeaveTimer = setTimeout(() => { el.hidden = true; el.classList.remove("leaving"); }, 300);
}

for (const [id, f] of Object.entries(FOOD)) {

// Each sprite (and each of Matteo's moods) is rendered once into a small offscreen canvas.
const spriteCache = {};
function sprite(id, mood) {
  const key = mood ? id + ":" + mood : id;
  if (spriteCache[key]) return spriteCache[key];
  const variant = mood ? MATTEO_MOODS[mood] : null;
  const rows = SPRITES[id].map((r, i) => (variant && variant.rows[i]) || r);
  const colors = { ...BASE_COLORS, ...CHARACTERS[id].colors, ...(variant && variant.colors) };
  const c = document.createElement("canvas");
  c.width = Math.max(16, ...rows.map(r => r.length)); c.height = rows.length;
  const g = c.getContext("2d");
  rows.forEach((row, y) => [...row.padEnd(c.width, ".")].forEach((ch, x) => {
    if (ch !== "." && colors[ch]) { g.fillStyle = colors[ch]; g.fillRect(x, y, 1, 1); }
  }));
  return (spriteCache[key] = c);
}

// ---------- Sound: tiny chiptune effects made with the Web Audio API ----------
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === "suspended" && !document.hidden) actx.resume();
  startMusic();
  return actx;
}
function tone(f0, f1, dur, type = "square", vol = 0.06, delay = 0) {
  if (!saved.sfx || !actx) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol = 0.12) {
  if (!saved.sfx || !actx) return;
  const buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = actx.createBufferSource(), g = actx.createGain();
  src.buffer = buf; g.gain.value = vol;
  src.connect(g).connect(actx.destination);
  src.start();
}
const sfx = {
  flap:   () => tone(330, 660, 0.08, "square", 0.04),
  point:  () => { tone(988, 988, 0.06, "square", 0.05); tone(1319, 1319, 0.12, "square", 0.05, 0.06); },
  hit:    () => { noise(0.18, 0.14); tone(320, 60, 0.4, "sawtooth", 0.06, 0.05); },
  bonus:  () => [1047, 1319, 1568].forEach((f, i) => tone(f, f, 0.05, "square", 0.045, i * 0.04)),
  start:  () => [523, 659, 784].forEach((f, i) => tone(f, f, 0.08, "square", 0.04, i * 0.07)),
  record: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, f, 0.1, "triangle", 0.07, 0.45 + i * 0.09)),
  level:  () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, f, 0.07, "square", 0.05, i * 0.06)),
  unlock: () => [587, 740, 880, 1175, 880, 1175, 1480].forEach((f, i) => tone(f, f, 0.09, "square", 0.06, 0.5 + i * 0.08)),
  comboLost: () => tone(440, 220, 0.18, "square", 0.04),
};

// ---------- Music: "La rotta del Baratie", an 8-bit sea shanty in D minor ----------
// 6/8 time: six eighth notes per bar, 16 bars. "-" holds the previous note, "." is a rest.
const SONG = {
  bpm: 100,   // dotted quarters per minute
  lead: "D5 - A4 D5 E5 F5 | E5 - D5 C5 - A4 | A#4 - D5 C5 - A4 | A4 - - . . A4 | " +
        "D5 - A4 D5 E5 F5 | G5 - F5 E5 - C5 | D5 - E5 C#5 - E5 | D5 - - . . . | " +
        "F5 - F5 G5 - A5 | A5 - G5 F5 - E5 | D5 - E5 F5 - D5 | E5 - - C#5 . . | " +
        "F5 - F5 G5 - A5 | C6 - A5 G5 - F5 | E5 - C#5 E5 - A4 | D5 - - D5 . .",
  chords: ["Dm", "C", "Bb", "A", "Dm", "C", "A", "Dm", "F", "C", "Dm", "A", "F", "C", "A", "Dm"],
};
const STEPS_PER_BAR = 6;
const BASS = { Dm: ["D3", "A2"], C: ["C3", "G2"], Bb: ["A#2", "F3"], A: ["A2", "E3"], F: ["F2", "C3"] };
const LEAD_STEPS = SONG.lead.replace(/\|/g, " ").trim().split(/\s+/);
function freq(n) {
  const m = /^([A-G])(#?)(\d)$/.exec(n);
  const semis = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] ? 1 : 0) + (Number(m[3]) - 4) * 12 - 9;
  return 440 * Math.pow(2, semis / 12);
}
const music = { gain: null, timer: null, step: 0, next: 0, hat: null };
function musicVoice(f, t0, dur, type, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t0);
  g.gain.setValueAtTime(vol, t0 + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(music.gain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function playStep(i, t0, step) {
  const tok = LEAD_STEPS[i];
  if (tok !== "." && tok !== "-") {
    let len = 1;
    while (LEAD_STEPS[(i + len) % LEAD_STEPS.length] === "-") len++;
    musicVoice(freq(tok), t0, step * len * 0.95, "square", 0.045);
  }
  const beat = i % STEPS_PER_BAR;
  if (beat === 0 || beat === 3) {                            // oom-pah bass on the two big beats of 6/8
    musicVoice(freq(BASS[SONG.chords[Math.floor(i / STEPS_PER_BAR)]][beat / 3]), t0, step * 2.6, "triangle", 0.1);
  } else {                                                   // light hi-hat in between
    const src = actx.createBufferSource(), g = actx.createGain();
    src.buffer = music.hat; g.gain.value = 0.025;
    src.connect(g).connect(music.gain); src.start(t0);
  }
}
function startMusic() {
  if (!actx || music.timer) return;
  music.gain = actx.createGain();
  music.gain.gain.value = saved.music ? 1 : 0;
  music.gain.connect(actx.destination);
  music.hat = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.03), actx.sampleRate);
  const d = music.hat.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  music.next = actx.currentTime + 0.1;
  music.timer = setInterval(() => {
    // The band plays faster as the rush builds.
    const step = 60 / (SONG.bpm + (state === "play" ? level : 0) * 5) / 3;
    while (music.next < actx.currentTime + 0.15) {
      playStep(music.step, music.next, step);
      music.next += step;
      music.step = (music.step + 1) % LEAD_STEPS.length;
    }
  }, 25);
}
document.addEventListener("visibilitychange", () => {
  if (!actx) return;
  if (document.hidden) actx.suspend();
  else { actx.resume(); music.next = actx.currentTime + 0.1; }
});

// ---------- Game state ----------
let state, player, cols, foods, pops, score, t, particles, shake, flash, newRecord;
let level, cleared, combo, banner, nearMiss;
let scroll = 0;

function reset() {
  state = "ready";
  player = { y: 110, vy: 0, tilt: 0 };
  cols = [];
  foods = [];
  pops = [];
  score = 0;
  t = 0;
  particles = [];
  shake = 0;
  flash = 0;
  newRecord = false;
  level = 0;
  cleared = 0;
  combo = 0;
  banner = null;
  nearMiss = [];
  if (typeof hideBoss === "function") hideBoss(false);
  for (let i = 0; i < 3; i++) addCol(W + 40 + i * SPACING);
}

const speed = () => SPEED + level * SPEED_STEP;

function addCol(x) {
  const gap = GAP - level * GAP_STEP;
  const min = CEIL_Y + 10, max = COUNTER_Y - gap - 22;
  const col = { x, gap, top: Math.round(min + Math.random() * (max - min)), passed: false };
  const prev = cols[cols.length - 1];
  // A snack halfway between two columns, on the line between their openings (a little off it, to make you work).
  if (prev && Math.random() < FOOD_CHANCE) {
    const midY = (prev.top + prev.gap / 2 + col.top + col.gap / 2) / 2 + (Math.random() - 0.5) * 24;
    foods.push({ x: (prev.x + COL_W + x) / 2 - 5, y: Math.round(midY), kind: Math.random() < 0.5 ? "burger" : "fries" });
  }
  cols.push(col);
}

function flap() {
  if (!startEl.hidden) return;   // the start screen is up
  audio();
  if (state === "over") {
    if (t > 0.7) reset();        // short pause so a frantic tap doesn't skip the score screen
    return;
  }
  if (state === "ready") state = "play";
  player.vy = FLAP;
  sfx.flap();
}

canvas.addEventListener("pointerdown", e => { e.preventDefault(); flap(); });
window.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, button")) return;   // let typing and buttons work
  if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); flap(); }
});

function update(dt) {
  t += dt;
  if (state !== "over") scroll += speed() * dt;
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
  shake = Math.max(0, shake - dt);
  flash = Math.max(0, flash - dt * 3);

  for (const p of particles) { p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0 && p.y < H);

  if (state === "ready") {
    player.y = 110 + Math.round(Math.sin(t * 4) * 4);
    return;
  }
  if (state === "over") {
    if (player.y < COUNTER_Y - 8) {
      player.vy = Math.min(MAX_FALL, player.vy + GRAVITY * dt);
      player.y = Math.min(COUNTER_Y - 8, player.y + player.vy * dt);
      player.tilt = Math.min(Math.PI / 2, player.tilt + dt * 8);
    }
    return;
  }

  player.vy = Math.min(MAX_FALL, player.vy + GRAVITY * dt);
  player.y += player.vy * dt;
  player.tilt = player.vy < 0 ? -0.35 : Math.min(Math.PI / 2, player.tilt + dt * 3.2);
  if (player.y < 8) { player.y = 8; player.vy = 0; }   // the ceiling stops you, it doesn't end the run

  for (const c of cols) {
    c.x -= speed() * dt;
    if (!c.passed && c.x + COL_W < PLAYER_X - 5) {
      c.passed = true; score++; cleared++; sfx.point();
      if (cleared % LEVEL_EVERY === 0 && level < MAX_LEVEL) {
        level++;
        banner = { text: LEVEL_NAMES[level - 1], life: 1.8 };
        sfx.level();
      }
    }
  }
  if (cols[0].x < -COL_W - 8) { cols.shift(); addCol(cols[cols.length - 1].x + SPACING); }

  for (const f of foods) {
    f.x -= speed() * dt;
    if (!f.taken && PLAYER_X + 6 > f.x && PLAYER_X - 6 < f.x + 10 && player.y + 8 > f.y && player.y - 8 < f.y + 9) {
      f.taken = true;
      combo++;
      const mult = Math.min(combo, MAX_COMBO);
      const pts = FOOD[f.kind].points * mult;
      score += pts;
      sfx.bonus();
      if (mult > 1) tone(1568 + mult * 120, 1568 + mult * 120, 0.08, "square", 0.04, 0.12);
      pops.push({ x: f.x + 5, y: f.y - 2, text: mult > 1 ? `+${pts} x${mult}` : "+" + pts, life: 0.9 });
      for (let i = 0; i < 6; i++) particles.push({ x: f.x + 5, y: f.y + 4, vx: (Math.random() - 0.5) * 80, vy: -40 - Math.random() * 60, life: 0.4, color: PAL.lemon });
    }
  }
  for (const f of foods) {
    if (!f.taken && !f.missed && f.x + 10 < PLAYER_X - 6) {   // flew past a snack: the combo is over
      f.missed = true;
      if (combo >= 2) { sfx.comboLost(); pops.push({ x: PLAYER_X + 10, y: player.y - 14, text: "COMBO PERSA", life: 0.9 }); }
      combo = 0;
    }
  }
  foods = foods.filter(f => !f.taken && f.x > -12);
  for (const p of pops) { p.y -= 20 * dt; p.life -= dt; }
  pops = pops.filter(p => p.life > 0);

  if (player.y + 9 > COUNTER_Y || hitsCol()) crash();
}

function hitsCol() {
  // Player hitbox: 10×14 around the sprite's centre. Column caps stick out 2px on each side.
  const l = PLAYER_X - 5, r = PLAYER_X + 5, top = player.y - 7, bot = player.y + 7;
  return cols.some(c => r > c.x - 2 && l < c.x + COL_W + 2 && (top < c.top || bot > c.top + c.gap));
}

function crash() {
  state = "over";
  t = 0;
  sfx.hit();
  if (!reduceMotion) { shake = 0.3; flash = 1; }
  // The spritz goes flying: orange drops, lemon and bits of glass.
  const colors = [PAL.drink, PAL.drink, PAL.lemon, PAL.glassware];
  for (let i = 0; i < 18; i++) {
    particles.push({
      x: PLAYER_X + 6, y: player.y - 4,
      vx: (Math.random() - 0.3) * 140, vy: -60 - Math.random() * 140,
      life: 0.6 + Math.random() * 0.6, color: colors[i % colors.length],
    });
  }
  const everBefore = bestEver();
  if (score > best) {
    best = score;
    newRecord = true;
    saved.best[saved.char] = best;
    persist();
    sfx.record();
  }
  const everNow = bestEver();
  const justUnlocked = Object.values(CHARACTERS).filter(c => c.unlock > everBefore && c.unlock <= everNow);
  const nextLock = Object.values(CHARACTERS).filter(c => c.unlock > everNow).sort((a, b) => a.unlock - b.unlock)[0];
  // "So close": the nearest rival just above you on the leaderboard, else your own record.
  const rival = board.rivalAbove(score);
  const pts = n => n === 1 ? "1 PUNTO" : n + " PUNTI";
  if (justUnlocked.length) { nearMiss = ["NUOVO PERSONAGGIO", justUnlocked[justUnlocked.length - 1].name.toUpperCase() + "!"]; sfx.unlock(); }
  else if (newRecord) nearMiss = [];
  else if (nextLock && nextLock.unlock - everNow <= 25) nearMiss = ["A " + pts(nextLock.unlock - everNow) + " DA", "SBLOCCARE " + nextLock.name.toUpperCase()];
  else if (rival && rival.best - score <= 10) nearMiss = ["A " + pts(rival.best - score + 1) + " DA", rival.nick.toUpperCase().slice(0, 16)];
  else if (score > 0 && best - score <= 5) nearMiss = ["TI MANCAVANO " + (best - score + 1), "PER IL RECORD"];
  else nearMiss = [];
  board.submit(score, saved.char);
  if (Math.random() < BOSS_CHANCE) {
    const line = bossLine(score);
    bossTimer = setTimeout(() => {
      if (state !== "over") return;
      document.getElementById("boss-text").textContent = line;
      drawBoss(matteoMood(score));
      const el = document.getElementById("boss");
      el.classList.remove("leaving");
      el.hidden = false;
      bossLeaveTimer = setTimeout(() => hideBoss(true), BOSS_STAY_MS);
      tone(196, 147, 0.15, "square", 0.05); tone(147, 110, 0.2, "square", 0.05, 0.15);   // a grumpy "ahem"
    }, 700);
  }
}

  { glass: "#141014", cap: "#c9a24b", capRows: 2, profile: [3, 3, 2, 2, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7], skull: [7, "#e0b84b"] },
  { glass: "#e8762b", cap: "#1a1210", capRows: 2, profile: [3, 3, 2, 2, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7], skull: [7, "#1a1210"] },
  { glass: "#f2c93b", cap: "#1a1210", capRows: 2, profile: [3, 3, 2, 2, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7], skull: [7, "#1a1210"] },
  { glass: "#c0392b", cap: "#1a1210", capRows: 2, profile: [3, 3, 2, 2, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7], skull: [7, "#f5f2ec"] },
  { glass: "#2f6fa8", cap: "#1a1210", capRows: 2, profile: [3, 3, 2, 2, 7, 7, 7, 7, 7, 7, 7, 7, 7, 7], skull: [7, "#f5f2ec"] },
];
const SKULL = [".###.", "#####", "#.#.#", "#####", ".#.#."];
const HOUSE_COLORS = ["#f2c14b", "#e8762b", "#c0392b", "#f4a7b9", "#9fd0e8", "#f5f2ec"];

function drawGin(g, gin, x, shelfY, rnd) {
  const rows = gin.profile, maxW = Math.max(...rows), top = shelfY - rows.length;
  const labelColor = gin.label && (Array.isArray(gin.label[2]) ? gin.label[2][Math.floor(rnd() * gin.label[2].length)] : gin.label[2]);
  rows.forEach((w, i) => {
    const x0 = x + Math.floor((maxW - w) / 2), y = top + i;
    g.fillStyle = i < gin.capRows ? gin.cap : gin.glass;
    g.fillRect(x0, y, w, 1);
    if (i < gin.capRows || w < maxW) return;
    if (gin.ridges) { g.fillStyle = "rgba(0, 0, 0, 0.3)"; for (let rx = x0 + 1; rx < x0 + w - 1; rx += 2) g.fillRect(rx, y, 1, 1); }
    if (gin.facets) { g.fillStyle = "rgba(255, 255, 255, 0.35)"; g.fillRect(x0 + 2, y, 1, 1); g.fillRect(x0 + w - 3, y, 1, 1); }
    if (gin.label && i >= gin.label[0] && i <= gin.label[1]) {
      g.fillStyle = labelColor; g.fillRect(x0 + 1, y, w - 2, 1);
      if (i === Math.floor((gin.label[0] + gin.label[1]) / 2)) { g.fillStyle = "rgba(26, 18, 16, 0.55)"; g.fillRect(x0 + 2, y, w - 4, 1); }  // a line of "text"
    }
    if (gin.band && i === gin.band[0]) { g.fillStyle = gin.band[1]; g.fillRect(x0 + 1, y, w - 2, 1); }
    if (gin.seal && i === gin.seal[0]) { g.fillStyle = gin.seal[1]; g.fillRect(x0 + Math.floor(w / 2) - 1, y - 1, 2, 2); }
    if (gin.houses && i >= gin.houses[0] && i <= gin.houses[1]) {
      for (let hx = x0 + 1; hx < x0 + w - 1; hx++) {
        if (i === gin.houses[0] && hx % 2) continue;                    // jagged rooftops
        g.fillStyle = HOUSE_COLORS[(hx * 7 + Math.floor(hx / 2)) % HOUSE_COLORS.length]; g.fillRect(hx, y, 1, 1);
      }
    }
  });
  if (gin.skull) {
    const sx = x + Math.floor((maxW - 5) / 2);
    g.fillStyle = gin.skull[1];
    SKULL.forEach((row, dy) => [...row].forEach((ch, dx) => { if (ch === "#") g.fillRect(sx + dx, top + gin.skull[0] + dy, 1, 1); }));
  }
  g.fillStyle = "rgba(255, 255, 255, 0.4)";                       // shine down the left of the body
  rows.forEach((w, i) => { if (i >= gin.capRows && w >= 4) g.fillRect(x + Math.floor((maxW - w) / 2) + 1, top + i, 1, 1); });
  return maxW;
}

const shelfLayer = (() => {
  const c = document.createElement("canvas"); c.width = SHELF_TILE; c.height = COUNTER_Y - CEIL_Y;
  const g = c.getContext("2d");
  let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (const sy of [96, 136]) {
    let x = 2;
    while (true) {
      const gin = GINS[Math.floor(rnd() * GINS.length)];
      const w = Math.max(...gin.profile);
      if (x + w > SHELF_TILE - 2) break;
      drawGin(g, gin, x, sy, rnd);
      x += w + 1 + Math.floor(rnd() * 3);
    }
    g.fillStyle = PAL.shelf; g.fillRect(0, sy, SHELF_TILE, 3);
    g.fillStyle = PAL.shelfDark; g.fillRect(0, sy + 3, SHELF_TILE, 2);
  }
  return c;
})();

// Burgundy wall: left-to-right shade with the fine honeycomb texture of the real one.
const wallLayer = (() => {
  const c = document.createElement("canvas"); c.width = W; c.height = COUNTER_Y - CEIL_Y;
  const g = c.getContext("2d");
  const [a, b] = [PAL.wallLeft, PAL.wallRight];
  for (let x = 0; x < W; x++) {
    const k = x / (W - 1);
    const rgb = a.map((v, i) => Math.round(v + (b[i] - v) * k));
    g.fillStyle = `rgb(${rgb})`; g.fillRect(x, 0, 1, c.height);
    for (let y = (x % 6 < 3 ? 0 : 2); y < c.height; y += 4) {
      if (x % 3 === 0) { g.fillStyle = `rgb(${rgb.map(v => v + 9)})`; g.fillRect(x, y, 1, 1); }
      else if (x % 3 === 1) { g.fillStyle = `rgb(${rgb.map(v => v - 7)})`; g.fillRect(x, y + 1, 1, 1); }
    }
  }
  return c;
})();

const signLayer = (() => {
  const lw = LOGO[0].length, lh = LOGO.length, pad = 5;
  const c = document.createElement("canvas"); c.width = lw + pad * 2; c.height = lh + pad * 2 + 6;
  const g = c.getContext("2d");
  g.fillStyle = PAL.outline; g.fillRect(0, 6, c.width, c.height - 6);           // plaque on two wires
  g.fillStyle = PAL.plaque; g.fillRect(1, 7, c.width - 2, c.height - 8);
  g.fillStyle = PAL.cord; g.fillRect(6, 0, 1, 7); g.fillRect(c.width - 7, 0, 1, 7);
  const lit = (dx, dy, color) => LOGO.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === "#") { g.fillStyle = color; g.fillRect(pad + x + dx, pad + 6 + y + dy, 1, 1); }
  }));
  g.globalAlpha = 0.35;                                                           // glow
  for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) lit(dx, dy, PAL.neonGlow);
  g.globalAlpha = 1;
  lit(0, 0, PAL.neon);
  return c;
})();
const SIGN_EVERY = 4;   // every 4th lamp slot holds the neon sign instead

function drawBackground() {
  ctx.drawImage(wallLayer, 0, CEIL_Y);

  const shelfOff = -(Math.floor(scroll * 0.4) % SHELF_TILE);
  for (let x = shelfOff; x < W; x += SHELF_TILE) ctx.drawImage(shelfLayer, x, CEIL_Y);

  // Pendant lamps with a soft warm glow, slow parallax; now and then the Baratie sign.
  const lampScroll = Math.floor(scroll * 0.2);
  for (let k = Math.floor((lampScroll - 40) / 72); 20 + k * 72 - lampScroll < W + 40; k++) {
    const lx = 20 + k * 72 - lampScroll;
    if (((k % SIGN_EVERY) + SIGN_EVERY) % SIGN_EVERY === 2) {
      ctx.drawImage(signLayer, Math.round(lx - signLayer.width / 2), CEIL_Y + 2);
      continue;
    }
    ctx.fillStyle = PAL.lamp;
    ctx.globalAlpha = 0.05;
    for (let r = 22; r > 0; r -= 2) { ctx.beginPath(); ctx.arc(lx, CEIL_Y + 26, r, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
    px(lx, CEIL_Y, 1, 18, PAL.cord);
    px(lx - 5, CEIL_Y + 18, 11, 2, PAL.lampShade);
    px(lx - 6, CEIL_Y + 20, 13, 4, PAL.lampShade);
    px(lx - 3, CEIL_Y + 24, 7, 2, PAL.lamp);
  }

  ctx.drawImage(ceilLayer, 0, 0);

  // Counter: polished top and a slatted front that scrolls at game speed.
  px(0, COUNTER_Y, W, 5, PAL.counterTop);
  px(0, COUNTER_Y, W, 1, PAL.counterLight);
  px(0, COUNTER_Y + 5, W, H - COUNTER_Y - 5, PAL.counterFront);
  const slatOff = -(Math.floor(scroll) % 8);
  for (let x = slatOff; x < W; x += 8) px(x, COUNTER_Y + 7, 2, H - COUNTER_Y - 7, PAL.counterSlat);
  px(0, COUNTER_Y + 5, W, 2, PAL.counterSlat);
}

// ---------- Obstacles ----------
// Top: a wooden glass rack hanging from the ceiling. Bottom: a chrome beer-tap column rising from the counter.
function drawCol(c) {
  const x = Math.round(c.x), gapTop = c.top, gapBot = c.top + c.gap;

  px(x, 0, COL_W, gapTop - 6, PAL.rack);
  px(x, 0, 2, gapTop - 6, PAL.rackDark);
  px(x + COL_W - 3, 0, 3, gapTop - 6, PAL.rackDark);
  px(x + 4, 0, 2, gapTop - 6, PAL.rackLight);
  for (let gy = gapTop - 20; gy > 4; gy -= 14) {          // upside-down wine glasses hanging in the rack
    px(x + 10, gy, 1, 4, PAL.glassware);
    px(x + 8, gy + 4, 5, 1, PAL.glassware);
    px(x + 8, gy + 5, 1, 4, PAL.glassware);
    px(x + 12, gy + 5, 1, 4, PAL.glassware);
    px(x + 9, gy + 9, 3, 1, PAL.glassware);
  }
  px(x - 2, gapTop - 6, COL_W + 4, 6, PAL.rackDark);
  px(x - 1, gapTop - 5, COL_W + 2, 3, PAL.rack);
  px(x - 2, gapTop - 1, COL_W + 4, 1, PAL.outline);

  const h = COUNTER_Y - gapBot;
  px(x, gapBot, COL_W, h, PAL.chrome);
  px(x, gapBot, 1, h, PAL.outline);
  px(x + COL_W - 1, gapBot, 1, h, PAL.outline);
  px(x + 4, gapBot, 3, h, PAL.chromeLight);
  px(x + COL_W - 6, gapBot, 4, h, PAL.chromeDark);
  px(x - 2, gapBot, COL_W + 4, 7, PAL.chromeDark);
  px(x - 1, gapBot + 1, COL_W + 2, 4, PAL.chrome);
  px(x + 2, gapBot + 1, COL_W - 4, 1, PAL.chromeLight);
  px(x - 2, gapBot + 6, COL_W + 4, 1, PAL.outline);
  px(x + COL_W, gapBot + 14, 5, 3, PAL.chromeDark);       // spout and red tap handle
  px(x + COL_W + 3, gapBot + 17, 2, 2, PAL.chromeDark);
  px(x + COL_W + 1, gapBot + 8, 3, 6, PAL.tap);
}

// ---------- Player ----------
function drawPlayer(id, cx, cy, tilt, armUp, mood) {
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));
  ctx.rotate(Math.round(tilt / 0.26) * 0.26);   // tilt in coarse steps, like an old cartridge
  ctx.drawImage(sprite(id, mood), -8 - (CHARACTERS[id].ox || 0), -10);   // ox: extra columns on the left (Nick's cap peak)
  // Arm and tray with a spritz: raised on each flap.
  const ty = armUp ? -6 : -1;
  px(6, 2, 3, 2, BASE_COLORS.s);
  if (armUp) px(8, -3, 2, 5, BASE_COLORS.s);
  px(5, ty + 2, 11, 1, PAL.tray);
  px(6, ty + 3, 9, 1, PAL.trayDark);
  px(9, ty - 5, 4, 7, PAL.glassware);
  px(10, ty - 3, 2, 4, PAL.drink);
  px(12, ty - 6, 2, 2, PAL.lemon);
  ctx.restore();
}

// ---------- HUD and screens ----------
function text(str, x, y, size = 8, color = PAL.text, align = "center") {
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = "top";
  const sh = Math.max(1, Math.round(size / 8));
  ctx.fillStyle = PAL.shadow;
  ctx.fillText(str, Math.round(x) + sh, Math.round(y) + sh);
  ctx.fillStyle = color;
  ctx.fillText(str, Math.round(x), Math.round(y));
}

function panel(x, y, w, h) {
  px(x, y, w, h, PAL.outline);
  px(x + 1, y + 1, w - 2, h - 2, PAL.panelDark);
  px(x + 2, y + 2, w - 4, h - 4, PAL.panel);
  px(x + 2, y + 2, w - 4, 1, PAL.panelLight);
}

// Bottle-cap medal: the crimped edge is what makes it a cap.
function capMedal(cx, cy, color) {
  for (let a = 0; a < 16; a++) {
    const ang = (a / 16) * Math.PI * 2;
    px(cx + Math.cos(ang) * 9 - 1, cy + Math.sin(ang) * 9 - 1, 3, 3, color);
  }
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
  ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
  px(cx - 4, cy - 6, 3, 2, "rgba(255, 255, 255, 0.6)");
}

function rank(n) {
  if (n >= 300) return { name: "LEGGENDA", color: PAL.neon };
  if (n >= 150) return { name: "CAPO SALA", color: PAL.gold };
  if (n >= 75) return { name: "CAMERIERE", color: PAL.silver };
  if (n >= 25) return { name: "APPRENDISTA", color: PAL.bronze };
  return { name: "IN PROVA", color: null };
}

function drawHud() {
  if (state === "play") {
    text(String(score), W / 2, 50, 16);
    if (combo >= 2) text("COMBO x" + Math.min(combo, MAX_COMBO), W / 2, 72, 8, PAL.lamp);
    if (banner && Math.floor(banner.life * 6) % 2 === 0) text(banner.text, W / 2, 96, 10, PAL.neon);
  }
  if (state === "ready" && startEl.hidden) {
    text("PRONTI?", W / 2, 64, 16, PAL.lamp);
    text(CHARACTERS[saved.char].name.toUpperCase(), W / 2, 88, 8);
    if (Math.floor(t * 2) % 2 === 0) text("TOCCA PER VOLARE", W / 2, 150, 8);
  }
  if (state === "over") {
    text("TURNO FINITO", W / 2, 50, 10, PAL.lamp);
    panel(16, 68, W - 32, 92);
    const r = rank(score);
    if (r.color) capMedal(40, 100, r.color);
    else { px(31, 91, 18, 18, PAL.panelDark); px(33, 93, 14, 14, PAL.panel); }
    text("PUNTI", 92, 78, 8, PAL.lamp);
    text(String(score), 92, 90, 8);
    text("RECORD", 92, 108, 8, PAL.lamp);
    text(String(best), 92, 120, 8);
    text(r.name, W / 2, 142, 8, r.color || PAL.text);
    ctx.globalAlpha = 0.8; px(0, 162, W, 46, PAL.outline); ctx.globalAlpha = 1;   // dark strip so the lines read over the shelves
    if (newRecord && !nearMiss.length && Math.floor(t * 4) % 2 === 0) text("NUOVO RECORD!", W / 2, 168, 8, PAL.lamp);
    nearMiss.forEach((line, i) => text(line, W / 2, 166 + i * 11, 8, PAL.neon));
    if (t > 0.7) text("TOCCA E RIPROVA", W / 2, 194, 8);
  }
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * 6), Math.round((Math.random() - 0.5) * 6));
  drawBackground();
  cols.forEach(drawCol);
  for (const f of foods) ctx.drawImage(foodSprites[f.kind], Math.round(f.x), Math.round(f.y + Math.sin(t * 5 + f.x * 0.1) * 1.5));
  drawPlayer(saved.char, PLAYER_X, player.y, player.tilt, state === "play" && player.vy < 0);
  for (const p of particles) px(p.x, p.y, 2, 2, p.color);
  ctx.restore();
  if (flash > 0) { ctx.globalAlpha = flash * 0.8; px(0, 0, W, H, PAL.white); ctx.globalAlpha = 1; }
  for (const p of pops) text(p.text, p.x, p.y, 8, PAL.lamp);
  drawHud();
}

// ---------- Start screen and controls ----------
const startEl = document.getElementById("start");
const nickInput = document.getElementById("nick");
const hintEl = document.getElementById("start-hint");
const playerEl = document.getElementById("player");
const homeBtn = document.getElementById("home-btn");
const musicBtn = document.getElementById("music-btn");
const sfxBtn = document.getElementById("sfx-btn");
const cardsEl = document.getElementById("cards");
for (const [id, c] of Object.entries(CHARACTERS)) {
  cardsEl.insertAdjacentHTML("beforeend",
    `<button type="button" class="card" role="radio" id="pick-${id}" data-char="${id}">` +
    `<canvas width="24" height="24" aria-hidden="true"></canvas>` +
    `<span class="card-name">${c.name.toUpperCase()}</span><span class="card-best" id="best-${id}"></span></button>`);
}
const cards = [...cardsEl.querySelectorAll(".card")];

// Best score on any character, here or saved in the leaderboard: it unlocks new characters.
function bestEver() {
  const remote = typeof board !== "undefined" ? board.myBest() : 0;
  return Math.max(remote, ...Object.values(saved.best));
}
const isUnlocked = id => bestEver() >= CHARACTERS[id].unlock;

function selectChar(id) {
  if (state === "play") return;                 // no swapping mid-run
  if (!isUnlocked(id)) {
    hintEl.textContent = `Fai ${CHARACTERS[id].unlock} punti per sbloccare ${CHARACTERS[id].name}.`;
    hintEl.classList.add("error");
    tone(220, 160, 0.12, "square", 0.04);
    return;
  }
  saved.char = id;
  best = saved.best[id] || 0;
  cards.forEach(b => b.setAttribute("aria-checked", String(b.dataset.char === id)));
  persist();
}

function updateCardRecords() {
  for (const id in CHARACTERS) {
    const open = isUnlocked(id);
    document.getElementById("best-" + id).textContent = open ? "Record " + (saved.best[id] || 0) : `Si sblocca a ${CHARACTERS[id].unlock}`;
    document.getElementById("pick-" + id).setAttribute("aria-disabled", String(!open));
  }
  drawPortraits();
}

function showStart() {
  if (state === "play") return;
  reset();
  updateCardRecords();
  startEl.hidden = false;
  playerEl.textContent = "";
  nickInput.focus({ preventScroll: true });
}

function startGame() {
  const nick = nickInput.value.trim().slice(0, 16);
  nickInput.value = nick;
  if (!nick) {
    nickInput.setAttribute("aria-invalid", "true");
    hintEl.textContent = "Scrivi un nickname per iniziare.";
    hintEl.classList.add("error");
    nickInput.focus();
    return;
  }
  nickInput.removeAttribute("aria-invalid");
  hintEl.textContent = "Con questo nome entri in classifica.";
  hintEl.classList.remove("error");
  audio();
  sfx.start();
  board.setNick(nick);
  reset();
  startEl.hidden = true;
  playerEl.textContent = `${nick} · ${CHARACTERS[saved.char].name}`;
  canvas.focus({ preventScroll: true });
}

cards.forEach(b => b.addEventListener("click", () => {
  audio();
  if (isUnlocked(b.dataset.char)) tone(660, 880, 0.06, "square", 0.04);
  selectChar(b.dataset.char);
}));
// Arrow keys move between the cards, as in a radio group.
startEl.querySelector(".cards").addEventListener("keydown", e => {
  if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) return;
  e.preventDefault();
  const i = cards.findIndex(b => b.dataset.char === saved.char);
  const dir = e.key === "ArrowLeft" || e.key === "ArrowUp" ? cards.length - 1 : 1;
  let j = (i + dir) % cards.length;
  while (!isUnlocked(cards[j].dataset.char) && j !== i) j = (j + dir) % cards.length;   // skip locked ones
  selectChar(cards[j].dataset.char);
  cards[j].focus();
});
startEl.addEventListener("submit", e => { e.preventDefault(); startGame(); });
// Back to the start screen to pick another character (only between runs, never mid-flight).
homeBtn.addEventListener("click", () => { audio(); tone(660, 440, 0.08, "square", 0.04); showStart(); });
function updateHomeButton() {
  const show = startEl.hidden && state !== "play";
  if (homeBtn.hidden === show) homeBtn.hidden = !show;
}
nickInput.addEventListener("input", () => {
  if (nickInput.value.trim()) { nickInput.removeAttribute("aria-invalid"); hintEl.classList.remove("error"); hintEl.textContent = "Con questo nome entri in classifica."; }
});

function updateAudioButtons() {
  musicBtn.textContent = saved.music ? "MUSICA SÌ" : "MUSICA NO";
  musicBtn.setAttribute("aria-pressed", String(saved.music));
  sfxBtn.textContent = saved.sfx ? "EFFETTI SÌ" : "EFFETTI NO";
  sfxBtn.setAttribute("aria-pressed", String(saved.sfx));
  if (music.gain) music.gain.gain.setTargetAtTime(saved.music ? 1 : 0, actx.currentTime, 0.05);
}
musicBtn.addEventListener("click", () => { saved.music = !saved.music; persist(); audio(); updateAudioButtons(); });
sfxBtn.addEventListener("click", () => { saved.sfx = !saved.sfx; persist(); audio(); updateAudioButtons(); sfx.flap(); });

// Each card shows the character's sprite, drawn by the same code the game uses.
function drawPortraits() {
  const gameCtx = ctx;
  for (const card of cards) {
    const pc = card.querySelector("canvas");
    ctx = pc.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, pc.width, pc.height);
    drawPlayer(card.dataset.char, 9, 13, 0, false);
    if (!isUnlocked(card.dataset.char)) {          // locked: a dark silhouette
      ctx.globalCompositeOperation = "source-atop";
      ctx.fillStyle = PAL.outline; ctx.fillRect(0, 0, pc.width, pc.height);
      ctx.globalCompositeOperation = "source-over";
    }
  }
  ctx = gameCtx;
}

// ---------- Shared leaderboard ----------
// One document per player at scores/<their id>: their best run and who they played as.
const board = (() => {
  const listEl = document.getElementById("board-list");
  const statusEl = document.getElementById("board-status");
  const nickEl = nickInput;
  let db = null, myId = null, mine = null, writing = Promise.resolve(), canWrite = true, entries = [];
  nickEl.value = saved.nick || "";

  const setStatus = text => { statusEl.textContent = text; };

  // Writes to my own document go one at a time.
  function writeMine(doc) {
    writing = writing.then(() => db.doc("scores/" + myId).set(doc)).then(() => { mine = doc; }, err => {
      if (err && err.code === "invalid_argument") {
        canWrite = false;
        setStatus("Puoi vedere la classifica, ma non entrarci: chiedi ad Andrea di invitarti come Editor.");
      } else {
        setStatus("Non sono riuscito a salvare il punteggio. Riprova alla prossima partita.");
      }
    });
    return writing;
  }

  function render(snap) {
    listEl.textContent = "";
    entries = snap.docs.map(d => ({ id: d.id, nick: String(d.data().nick || "Anonimo"), best: Math.floor(Number(d.data().best) || 0) }));
    if (snap.empty) { setStatus("Ancora nessun punteggio: il primo record è tuo."); return; }
    if (canWrite) setStatus("");
    for (const d of snap.docs) {
      const row = d.data();
      const li = document.createElement("li");
      if (d.id === myId) li.className = "me";
      const who = document.createElement("span"); who.className = "who"; who.textContent = String(row.nick || "Anonimo");
      const as = document.createElement("span"); as.className = "as"; as.textContent = CHARACTERS[row.char] ? "come " + CHARACTERS[row.char].name : "";
      const pts = document.createElement("span"); pts.className = "pts"; pts.textContent = String(Math.floor(Number(row.best) || 0));
      li.append(who, as, pts);
      listEl.append(li);
    }
  }

  async function start() {
    const use = window.claude && window.claude.use;
    if (!use) { setStatus("La classifica condivisa funziona nella versione pubblicata su Claude."); return; }
    const [dbNs, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    myId = user ? await user.id() : null;
    if (!dbNs) { setStatus("Accedi a Claude per vedere la classifica."); return; }
    db = dbNs;
    if (!myId) { canWrite = false; }
    else if (user && (await user.can("data.write")) === false) { canWrite = false; }
    if (myId) {
      try {
        const snap = await db.doc("scores/" + myId).get();
        if (snap.exists) {
          mine = snap.data();
          if (!startEl.hidden) updateCardRecords();
          if (!nickEl.value) { nickEl.value = String(mine.nick || ""); saved.nick = nickEl.value; persist(); }
        }
      } catch (e) {}
    }
    db.collection("scores").orderBy("best", "desc").limit(10).onSnapshot(render, () => setStatus("Classifica non disponibile in questo momento."));
    if (!canWrite) setStatus("Puoi vedere la classifica, ma non entrarci: chiedi ad Andrea di invitarti come Editor.");
  }

  return {
    start,
    myBest: () => (mine ? Math.floor(Number(mine.best) || 0) : 0),
    // The closest other player whose best is above this score, if any.
    rivalAbove(score) {
      return entries.filter(e => e.id !== myId && e.best > score).sort((a, b) => a.best - b.best)[0] || null;
    },
    // A new nickname also renames this player's existing row in the leaderboard.
    setNick(nick) {
      saved.nick = nick;
      persist();
      if (db && myId && canWrite && mine && nick !== mine.nick) writeMine({ ...mine, nick });
    },
    submit(score, char) {
      const nick = (saved.nick || "").trim();
      if (!db || !myId || !canWrite || !score || !nick) return;
      if (mine && Number(mine.best) >= score) return;
      writeMine({ nick, best: score, char, at: new Date().toISOString() });
    },
  };
})();

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);   // clamp so a background tab doesn't teleport the player
  last = now;
  update(dt);
  render();
  updateHomeButton();
  requestAnimationFrame(frame);
}

ctx.imageSmoothingEnabled = false;
reset();
board.start();
selectChar(CHARACTERS[saved.char] && isUnlocked(saved.char) ? saved.char : "andrea");
updateAudioButtons();
showStart();
render();
requestAnimationFrame(frame);
</script>
</body>
</html>
